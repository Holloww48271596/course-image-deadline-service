[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "course-image-deadline-service"
version = "0.1.0"
description = "Resize course artwork on upload and report learner deadline status."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<12",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
